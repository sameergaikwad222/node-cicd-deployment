name: Deploy Node.js App to Vultr Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: deploy via ssh
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VULTR_HOST }}
          username: root
          key: ${{ secrets.VULTR_PRIVATE_KEY }}
          script: |
            cd /root/node-cicd-deployment
            git pull origin main
            docker-compose down
            docker-compose up -d --build
